services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: symfony_app
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DATABASE_URL: mysql://app:app_password@mysql:3306/app?serverVersion=8.0.32&charset=utf8mb4
      RUN_MIGRATIONS: "1"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - symfony

  nginx:
    image: nginx:1.27-alpine
    container_name: symfony_nginx
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-main.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - symfony

  mysql:
    image: mysql:8.0
    container_name: symfony_mysql
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_password" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - symfony

volumes:
  mysql_data:

networks:
  symfony:
    driver: bridge
